name: CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  build-and-test:
    name: Check, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # integration_tests needs a server; it skips itself without
      # MINA_ROSETTA_URL, so the unit run includes it harmlessly
      - run: cargo test --lib --tests
      - run: cargo test --doc
      - run: cargo clippy --all-targets --no-default-features --features rustls-tls -- -D warnings
      - run: cargo test --no-default-features --features rustls-tls --lib --tests
      - name: rustls builds without OpenSSL
        run: |
          if cargo tree --no-default-features --features rustls-tls -i openssl-sys >/dev/null 2>&1; then
            cargo tree --no-default-features --features rustls-tls -i openssl-sys
            exit 1
          fi
      - run: cargo doc --no-deps --all-features

  msrv:
    name: Build on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --lib --tests

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # the dependencies of every TLS choice, not only the default one
          arguments: --all-features
